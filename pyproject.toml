[project]
name = "vouch"
version = "0.1.0"
description = "Vouch — manufacturing authority control plane on Strands Agents + Bedrock AgentCore"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.52.0",
    "bedrock-agentcore>=1.21.0",
    "boto3>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vouch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
